{% extends 'base.html' %}
{% block title %}New Camp · BloodLink{% endblock %}
{% block content %}
<section class="section"><div class="container form-wrap">
  <div class="form-card reveal in">
    <div style="text-align:center;margin-bottom:22px"><div class="card-icon bg-green" style="margin:0 auto 12px"><i class="fa-solid fa-tent"></i></div><h2>Organize a Donation Camp</h2></div>
    <form method="post" novalidate>{% csrf_token %}
      {% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
      <button class="btn btn-primary btn-block"><i class="fa-solid fa-plus"></i> Create Camp & Notify Donors</button>
    </form>
  </div>
</div></section>
{% endblock %}
