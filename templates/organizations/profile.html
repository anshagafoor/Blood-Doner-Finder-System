{% extends 'base.html' %}
{% block title %}Organization Profile · BloodLink{% endblock %}
{% block content %}
<section class="section"><div class="container form-wrap">
  <div class="form-card reveal in"><h2 style="text-align:center;margin-bottom:22px">Organization Profile</h2>
    <form method="post" novalidate>{% csrf_token %}
      {% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
      <button class="btn btn-primary btn-block"><i class="fa-solid fa-floppy-disk"></i> Save</button>
    </form>
  </div>
</div></section>
{% endblock %}
